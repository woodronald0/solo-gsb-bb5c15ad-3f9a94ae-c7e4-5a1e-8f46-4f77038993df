services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - lottery-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz'))['status']=='ok' else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lottery-data:
